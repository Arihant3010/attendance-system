version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendance_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: attendance_web_app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://admin:secretpassword@db:5432/attendance_db
    depends_on:
      - db

volumes:
  postgres_data: